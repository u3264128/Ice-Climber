# C64 .prg linker config for the Ice Climber porting demo
MEMORY {
    # the two-byte load address $0801 makes the file a loadable .prg
    HDR:  start = $0800, size = $0002, fill = no;
    # A single contiguous PRG, with assets above the VIC's working memory.
    MAIN: start = $0801, size = $37FF, fill = yes;
    # Load buffer, replaced by screens, charset and sprites after boot.
    # Below $5000: boot code and the lower sprite half's stream (both used
    # while the sprites are unpacked). From $5000: the upper half's stream
    # (unpacked first, into $6000-$6FFF) and everything boot copies away.
    VIDEO: start = $4000, size = $1000, fill = yes;
    VIDEOHI: start = $5000, size = $2000, fill = yes;
    # Top of VIC bank 1: never displayed (idle lines are blanked).
    HIGH: start = $7000, size = $1000, fill = yes;
    ASSETS: start = $8000, size = $4000, fill = yes;
    EXTRA: start = $C000, size = $1000, fill = no;
    # Startup copies these helpers out of the disposable video load area.
    # Keep $FFF0 test return and the hardware vectors at $FFFA available.
    TOPRAM: start = $FC00, size = $03E0, file = "";
    # Page 7 above the raster $D015 table ($0700-$073F).
    LOWRAM: start = $0740, size = $00C0, file = "";
    # RAM under the I/O area for the transplanted NES objects ($01 = $34).
    # $D400 holds its ROM tables; Topi pages use $D100-$D3FF and $D500.
    IORAM: start = $D600, size = $0A00, file = "";
    IOTABLES: start = $D400, size = $0100, file = "";
    # The lower stack page: the deepest stack (main loop and IRQ) stays
    # above $01C0. $01A8-$01BF holds the original debris OAM entries.
    STACKRAM: start = $0100, size = $00A8, file = "";
    # RAM under I/O below the NES mirrors: the debris art for the condor blocks.
    IOLOW: start = $D000, size = $0040, file = "";
    # RAM under I/O after the debris motion bytes ($D0A8-$D0CF).
    IOMID: start = $D0D0, size = $0030, file = "";
    # RAM under the KERNAL after BONUS_SORT_COUNT, before CACHE_COPY.
    MUXRAM: start = $E984, size = $007C, file = "";
    # After generated copy commands and event masks, before bonus scratch.
    PRIORAM: start = $EB80, size = $0080, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,  type = ro;
    BASIC:    load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    SWAP:     load = MAIN, type = rw;   # fruit 0/9 or the death spin, by scene
    HIGH:     load = HIGH, type = ro;
    DATA:     load = ASSETS, align = $0100, type = ro;
    EXTRA:    load = EXTRA, type = ro;
    STARTUP:  load = VIDEO, type = ro;
    SPRITESLO: load = VIDEO, type = ro;
    PRIOCODE: load = VIDEO, run = PRIORAM, type = ro, define = yes;
    SPRITESHI: load = VIDEOHI, type = ro;
    HELPERS:  load = VIDEOHI, run = TOPRAM, type = ro, define = yes;
    LOWCODE:  load = VIDEOHI, run = LOWRAM, type = ro, define = yes;
    IOCODE:   load = VIDEOHI, run = IORAM, type = ro, define = yes;
    IODATA:   load = VIDEOHI, run = IOTABLES, type = ro, define = yes;
    IOART:    load = VIDEOHI, type = ro, define = yes;
    STACKCODE: load = VIDEOHI, run = STACKRAM, type = ro, define = yes;
    DEBRISART: load = VIDEOHI, run = IOLOW, type = ro, define = yes;
    IOMIDCODE: load = VIDEOHI, run = IOMID, type = ro, define = yes;
    MUXCODE:  load = VIDEOHI, run = MUXRAM, type = ro, define = yes;
}
